<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e6fd6">
<title>Bijan Izadian</title>
<style>
  /* The page runs under the phone's status bar and home indicator; the safe-area
     padding shows the html background there: sky blue on top, taskbar blue below. */
  html{background:linear-gradient(#1e6fd6 50%,#245edb 50%)}
  html,body{margin:0;height:100%}
  #desk{box-sizing:border-box;height:100vh;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

<body>
<div id="desk"></div>

<script src="xp-desktop.js"></script>
<script>
  // The fomo window's path list is encrypted with the unlock password
  // (scripts/encrypt-fomo-paths.mjs writes this line); it decrypts in the browser.

  var FOMO_LOCK_FORM =
    '<form class="xpd-lock" data-fomo-lock>' +
      '<p>Type the password to see the fomo links.</p>' +
      '<div class="xpd-lock__row"><input class="xpd-input" type="password" name="pw" aria-label="Password" autocomplete="off" required>' +
      '<button class="xpd-btn" type="submit">Unlock</button></div>' +
      '<p class="xpd-lock__err" role="alert" hidden></p>' +
    '</form>';

  // Groups of [heading, [[path, page name], ...]] as a two-column list of slash paths.
  function fomoPaths(groups) {
    var cols = [groups.slice(0, 2), groups.slice(2)];
    return '<div class="xpd-paths">' + cols.map(function (col) {
      return '<div>' + col.map(function (g) {
        return '<h3>' + g[0] + '</h3><ul>' + g[1].map(function (p) {
          return '<li><a href="' + p[0] + '" title="' + p[1] + '" target="_blank" rel="noopener">' + p[0] + '</a></li>';
        }).join('') + '</ul>';
      }).join('') + '</div>';
    }).join('') + '</div>';
  }

  function unlockFomo(password) {
    var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) return Promise.reject(new Error('unsupported'));
    return subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey({ name: 'PBKDF2', salt: bytes(FOMO_LOCKED.salt), iterations: 250000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return subtle.decrypt({ name: 'AES-GCM', iv: bytes(FOMO_LOCKED.iv) }, key, bytes(FOMO_LOCKED.data)); })
      .then(function (plain) { return fomoPaths(JSON.parse(new TextDecoder().decode(plain))); });
  }

  var fomoItem = { id: 'fomo', label: 'fomo', icon: 'bell', title: 'fomo',
    link: 'https://fomo.family', linkLabel: 'Open fomo', body: FOMO_LOCK_FORM };

  document.addEventListener('submit', function (e) {
    var form = e.target.closest && e.target.closest('[data-fomo-lock]');
    if (!form) return;
    e.preventDefault();
    var input = form.elements.pw, err = form.querySelector('.xpd-lock__err'), btn = form.querySelector('button');
    btn.disabled = true; err.hidden = true;
    unlockFomo(input.value).then(function (html) {
      fomoItem.body = html; // stays unlocked if the window is closed and reopened
      form.outerHTML = html;
    }, function (x) {
      err.textContent = x && x.message === 'unsupported' ? 'This browser can\'t unlock the links.' : 'Wrong password.';
      err.hidden = false; btn.disabled = false; input.value = ''; input.focus();
    });
  });

  XPDesktop.mount('#desk', {
    name: 'Bijan Izadian',
    subtitle: 'New York City',
    mark: 'B',
    wallpaper: '#4a8fe0 url(/assets/bliss.jpg) center / cover no-repeat',
    items: [
      { id: 'about',   label: 'About Bijan',   icon: 'notepad', title: 'About Bijan', menuDesc: 'Who I am', openOnLoad: true,
        body: '' },
      fomoItem,
      { id: 'build',   label: 'Build request', icon: 'form',    title: 'Build request',
        link: '/build', linkLabel: 'Open the form',
        body: '<p>Have a web app idea you want built? Send it through the intake form and I\'ll come back with scope, timing, and cost.</p>' },
      { id: 'resume',  label: 'Resume',        icon: 'doc',     title: 'Resume', menuDesc: 'PDF',
        link: '/resume.pdf', linkLabel: 'Open resume',
        body: '<p>One page.</p>' },
      { id: 'contact', label: 'Contact',       icon: 'mail',    title: 'Contact', menuDesc: 'Email, GitHub, LinkedIn',
        link: 'mailto:hello@bijanizadian.com', linkLabel: 'Send email',
        extra: [{ label: 'GitHub', href: 'https://github.com/' }, { label: 'LinkedIn', href: 'https://www.linkedin.com/in/' }],
        body: '<p>Email is the fastest way to reach me.</p>' },
      { id: 'art',     label: 'Art',           icon: 'art',     title: 'Art', menuDesc: 'Paintings & other work',
        body: '<p>A place for my art projects. Add a link to the gallery here when it\'s ready.</p>' },
      { id: 'bin',     label: 'Recycle Bin',   icon: 'bin',     title: 'Recycle Bin', corner: true,
        body: '<p>Empty.</p>' }
    ],
    startLeft: ['about', 'resume', 'contact', 'art', { label: 'GitHub', desc: 'Code', href: 'https://github.com/', icon: 'form' }],
    startHeading: 'Projects',
    startRight: ['fomo', 'build']
  });
</script>
</body>
</html>
