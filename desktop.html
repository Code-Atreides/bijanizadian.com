<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bijan Izadian</title>
<style>html,body{margin:0;height:100%}#desk{height:100vh}</style>
</head>
<body>
<div id="desk"></div>

<script src="xp-desktop.js"></script>
<script>
  // Groups of [heading, [[path, page name], ...]] as a two-column list of slash paths.
  function fomoPaths(groups) {
    var cols = [groups.slice(0, 2), groups.slice(2)];
    return '<div class="xpd-paths">' + cols.map(function (col) {
      return '<div>' + col.map(function (g) {
        return '<h3>' + g[0] + '</h3><ul>' + g[1].map(function (p) {
          return '<li><a href="' + p[0] + '" title="' + p[1] + '" target="_blank" rel="noopener">' + p[0] + '</a></li>';
        }).join('') + '</ul>';
      }).join('') + '</div>';
    }).join('') + '</div>';
  }

  XPDesktop.mount('#desk', {
    name: 'Bijan Izadian',
    subtitle: 'New York City',
    mark: 'B',
    items: [
      { id: 'about',   label: 'About Bijan',   icon: 'notepad', title: 'About Bijan', menuDesc: 'Who I am', openOnLoad: true,
        body: '' },
      { id: 'fomo',    label: 'fomo',          icon: 'bell',    title: 'fomo',
        link: 'https://fomo.family', linkLabel: 'Open fomo',
        body: fomoPaths([
          ['campus', [['/campus', 'Campus hub'], ['/campus/landing', 'Campus landing page'], ['/campus/directory', 'Page directory'], ['/campus/manual', 'Campus manual'], ['/campus/visit', 'Visit a friend'], ['/campus/ambassadors', 'Campus ambassadors'], ['/campus/ambassadors/apply', 'Apply to be an ambassador']]],
          ['team & earlier designs', [['/irrigation', 'Irrigation, the team workspace'], ['/campus-wars', 'Campus Wars'], ['/campus-connected', 'Earlier campus design']]],
          ['greek wars', [['/greekwars', 'Greek Wars'], ['/greekwars/onboard', 'Chapter onboarding'], ['/greekwars/claim', 'Onboard your chapter'], ['/greekwars/refer', 'Refer a fraternity'], ['/greekwars/invite', 'Greek Wars invite']]],
          ['dinners & events', [['/dinners', 'Dinner Series'], ['/dinners/apply', 'Apply to host a dinner'], ['/crewsheet', 'Dinner crew sheet'], ['/gameday', 'Game Day'], ['/hqvisitform', 'Come by fomo HQ']]]
        ]) },
      { id: 'build',   label: 'Build request', icon: 'form',    title: 'Build request',
        link: '/build', linkLabel: 'Open the form',
        body: '<p>Have a web app idea you want built? Send it through the intake form and I\'ll come back with scope, timing, and cost.</p>' },
      { id: 'resume',  label: 'Resume',        icon: 'doc',     title: 'Resume', menuDesc: 'PDF',
        link: '/resume.pdf', linkLabel: 'Open resume',
        body: '<p>One page.</p>' },
      { id: 'contact', label: 'Contact',       icon: 'mail',    title: 'Contact', menuDesc: 'Email, GitHub, LinkedIn',
        link: 'mailto:hello@bijanizadian.com', linkLabel: 'Send email',
        extra: [{ label: 'GitHub', href: 'https://github.com/' }, { label: 'LinkedIn', href: 'https://www.linkedin.com/in/' }],
        body: '<p>Email is the fastest way to reach me.</p>' },
      { id: 'art',     label: 'Art',           icon: 'art',     title: 'Art', menuDesc: 'Paintings & other work',
        body: '<p>A place for my art projects. Add a link to the gallery here when it\'s ready.</p>' },
      { id: 'bin',     label: 'Recycle Bin',   icon: 'bin',     title: 'Recycle Bin', corner: true,
        body: '<p>Empty.</p>' }
    ],
    startLeft: ['about', 'resume', 'contact', 'art', { label: 'GitHub', desc: 'Code', href: 'https://github.com/', icon: 'form' }],
    startHeading: 'Projects',
    startRight: ['fomo', 'build']
  });
</script>
</body>
</html>
