  // { links: [[path, label], ...] shown by label, groups: [[heading, [[path, page name], ...]], ...] shown by path }.
  function fomoPaths(list) {
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var link = function (href, text, title) {
      return '<li><a href="' + esc(href) + '"' + (title ? ' title="' + esc(title) + '"' : '') + ' target="_blank" rel="noopener">' + esc(text) + '</a></li>';
    };
    return '<div class="paths"><ul class="named">' + list.links.map(function (l) { return link(l[0], l[1]); }).join('') + '</ul>' +
      list.groups.map(function (g) {
        return esc(g[0]) + '<ul>' + g[1].map(function (p) { return link(p[0], p[0], p[1]); }).join('') + '</ul>';
      }).join('') + '</div>';
  }

  function unlockFomo(password) {
    var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) return Promise.reject(new Error('unsupported'));
    return subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey({ name: 'PBKDF2', salt: bytes(FOMO_LOCKED.salt), iterations: 250000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return subtle.decrypt({ name: 'AES-GCM', iv: bytes(FOMO_LOCKED.iv) }, key, bytes(FOMO_LOCKED.data)); })
      .then(function (plain) { return fomoPaths(JSON.parse(new TextDecoder().decode(plain))); });
  }

  team.querySelector('[data-fomo-lock]').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.currentTarget, input = form.elements.pw, err = form.querySelector('.err');
    input.disabled = true; err.hidden = true;
    unlockFomo(input.value).then(function (html) {
      form.outerHTML = html;
    }, function (x) {
      err.textContent = x && x.message === 'unsupported' ? 'can\'t unlock here' : 'wrong password';
      err.hidden = false; input.disabled = false; input.value = ''; input.focus();
    });
  });
