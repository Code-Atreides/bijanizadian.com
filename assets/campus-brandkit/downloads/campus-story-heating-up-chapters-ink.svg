  <title id="title">fomo campus — heating up chapters story template, ink</title>
  <desc id="description">Today’s heating-up chapters: five rows pairing each school with its chapter, with the school and chapter logos on either side. Ink colorway. 9:16 story; 1080 × 1920. The same pattern is available in six colorways and both formats.</desc>
