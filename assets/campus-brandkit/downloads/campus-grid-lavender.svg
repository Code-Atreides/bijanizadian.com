<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">fomo campus — pale lavender grid template</title>
  <desc id="description">Editable 1080 by 1350 grid template. Your campus, your people. The same colorway and message are available for both grid posts and stories.</desc>
  <metadata>fomo campus brand kit. All four colorways are interchangeable across grid posts and stories, one for each background the fomo brand kit allows. Text remains editable in Aeonik with Arial as fallback. Replace bracketed text before publishing. Essential content uses 72 px side margins, with a 250 px top and 340 px bottom quiet zone for stories. FOMO wordmark and graduation cap path data are unchanged from the supplied assets; only their color and proportional size change.</metadata>
