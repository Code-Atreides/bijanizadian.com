<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">fomo campus — chapter milestone grid template, lavender</title>
  <desc id="description">A large chapter-count celebration with editable milestone and context fields. Lavender colorway. 4:5 grid post; 1080 × 1350. The same pattern is available in six colorways and both formats.</desc>
  <metadata>Editable Aeonik text. Replace every bracketed placeholder before publishing. Counts, rates, totals, eligibility terms, and context must be supplied for the current campaign. School and chapter logos are paired placeholders, not invented marks. The campus mark and fomo wordmark paths are unchanged from the masters. Gradients and glows apply only to the background. The hand-drawn arrow sits just left of the call to action; move it with the text if the wording changes. Keep essential content inside the 72 px side margins; story quiet zones are 250 px at the top and 340 px at the bottom.</metadata>
